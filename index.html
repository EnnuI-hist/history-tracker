<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой прогресс | Трекер лекций</title>
  <style>
    :root {
      /* Apple-style Zinc + Indigo палитра */
      --bg-page: #18181b;          /* Zinc 900 */
      --bg-card: #27272a;          /* Zinc 800 */
      --bg-card-hover: #2e2e33;
      --bg-input: #1f1f23;
      --border-subtle: rgba(255, 255, 255, 0.07);
      
      --accent: #6366f1;           /* Calm Indigo */
      --accent-hover: #4f46e5;
      --accent-rgb: 99, 102, 241;
      
      --text-primary: #f4f4f5;     /* Zinc 100 */
      --text-secondary: #a1a1aa;   /* Zinc 400 */
      --text-muted: #71717a;       /* Zinc 500 */
      
      --danger: #f87171;
      --danger-hover: #ef4444;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.25), 0 2px 6px -1px rgba(0, 0, 0, 0.2);
      --shadow-card-hover: 0 10px 30px -4px rgba(0, 0, 0, 0.4);
      --shadow-modal: 0 25px 60px -12px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 100px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 720px;
      transition: max-width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .container.view-timeline {
      max-width: 1240px;
    }

    /* 1. Чистая шапка в стиле Apple */
    .app-header {
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      font-weight: 400;
      font-feature-settings: "tnum";
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-pill);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 2. Визуализация активности (Heatmap) в стиле GitHub */
    .heatmap-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 26px;
      box-shadow: var(--shadow-card);
    }

    .heatmap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .heatmap-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .heatmap-stats {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-feature-settings: "tnum";
    }

    .heatmap-scroll {
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 4px 0 2px;
      display: flex;
    }

    .heatmap-scroll::-webkit-scrollbar {
      display: none;
    }

    .heatmap-grid-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: none;
      min-width: max-content;
    }

    .heatmap-months-row {
      display: flex;
      height: 14px;
      margin-left: 24px;
      font-size: 0.68rem;
      color: var(--text-muted);
      position: relative;
    }

    .heatmap-month-label {
      position: absolute;
      white-space: nowrap;
    }

    .heatmap-body {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .heatmap-days-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 20px;
      font-size: 0.64rem;
      color: var(--text-muted);
      line-height: 10px;
      padding-top: 1px;
    }

    .heatmap-days-col span {
      height: 10px;
      display: flex;
      align-items: center;
    }

    .heatmap-columns {
      display: flex;
      gap: 3px;
    }

    .heatmap-week-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .heatmap-cell {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      transition: transform 0.1s ease, filter 0.1s ease;
      cursor: pointer;
      flex-shrink: 0;
    }

    .heatmap-cell:hover {
      transform: scale(1.35);
      z-index: 10;
      filter: brightness(1.25);
    }

    .heatmap-cell.level-0 {
      background-color: #212124;
    }

    .heatmap-cell.level-1 {
      background-color: rgba(99, 102, 241, 0.32);
    }

    .heatmap-cell.level-2 {
      background-color: rgba(99, 102, 241, 0.65);
    }

    .heatmap-cell.level-3 {
      background-color: #6366f1;
      box-shadow: 0 0 6px rgba(99, 102, 241, 0.45);
    }

    .heatmap-cell.future {
      visibility: hidden;
      pointer-events: none;
    }

    .heatmap-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .heatmap-legend .heatmap-cell {
      cursor: default;
    }

    .heatmap-legend .heatmap-cell:hover {
      transform: none;
    }

    /* Тултип активности */
    .heatmap-tooltip {
      position: fixed;
      pointer-events: none;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f4f4f5;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 5px 9px;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      z-index: 2000;
      opacity: 0;
      transform: translate(-50%, -100%) translateY(-6px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .heatmap-tooltip.visible {
      opacity: 1;
      transform: translate(-50%, -100%) translateY(-10px);
    }

    /* 3. Поиск и горизонтальные теги-фильтры */
    .search-container {
      position: relative;
      margin-bottom: 18px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      height: 44px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: 0 40px 0 42px;
      font-size: 0.92rem;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-input:focus {
      background: #202024;
      border-color: rgba(var(--accent-rgb), 0.5);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .search-clear-btn:hover {
      color: var(--text-primary);
    }

    /* Скроллируемые треки фильтров (Pills) */
    .filter-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .filter-track {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
    }

    .filter-track::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--bg-card);
      border: none;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.18s ease;
      user-select: none;
    }

    .chip-btn:hover {
      background: #323238;
      color: var(--text-primary);
    }

    .chip-btn.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.35);
    }

    .filter-divider {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      flex-shrink: 0;
      margin: 0 2px;
    }

    .reset-filter-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px 8px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .reset-filter-link:hover {
      color: var(--text-primary);
    }

    /* Панель заголовка списков и переключения режимов */
    .view-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      min-height: 32px;
    }

    .matching-status {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0;
      min-height: 18px;
      padding-left: 2px;
    }

    .view-toggle {
      display: inline-flex;
      align-items: center;
      background: var(--bg-card);
      padding: 3px;
      border-radius: var(--radius-pill);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      margin-left: auto;
    }

    .view-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
      user-select: none;
    }

    .view-toggle-btn:hover {
      color: var(--text-primary);
    }

    .view-toggle-btn.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(var(--accent-rgb), 0.35);
    }

    /* 4. Стили таймлайна по эпохам */
    .timeline-container {
      width: 100%;
    }

    /* Быстрая навигация по эпохам */
    .timeline-nav-track {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 2px 14px;
      margin-bottom: 6px;
    }

    .timeline-nav-track::-webkit-scrollbar {
      display: none;
    }

    .timeline-nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      font-size: 0.76rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
      user-select: none;
      font-family: inherit;
    }

    .timeline-nav-pill:hover {
      background: #323238;
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .timeline-nav-pill.active {
      background: rgba(var(--accent-rgb), 0.18);
      border-color: rgba(var(--accent-rgb), 0.45);
      color: #ffffff;
    }

    .nav-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.7;
    }

    .timeline-nav-pill.completed-all .nav-pill-dot {
      background: #34d399;
      opacity: 1;
    }

    .nav-pill-badge {
      font-size: 0.68rem;
      opacity: 0.65;
      font-feature-settings: "tnum";
    }

    /* Горизонтальная лента эпох (desktop) */
    .timeline-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 4px 4px 28px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .timeline-track::-webkit-scrollbar {
      height: 6px;
    }

    .timeline-track::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-pill);
    }

    .timeline-track::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-pill);
    }

    .timeline-track::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Колонка эпохи на десктопе */
    .timeline-era-section {
      min-width: 330px;
      max-width: 360px;
      flex-shrink: 0;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      scroll-snap-align: start;
      overflow: hidden;
    }

    /* Крупная липкая шапка эпохи */
    .timeline-era-sticky-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(39, 39, 42, 0.95);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .era-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .era-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .era-milestone-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.6);
      flex-shrink: 0;
    }

    .era-index-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    .era-counter-pill {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-feature-settings: "tnum";
    }

    .era-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .era-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-pill);
      overflow: hidden;
      margin-top: 2px;
    }

    .era-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      transition: width 0.3s ease;
    }

    /* Карточки внутри колонки эпохи */
    .timeline-era-cards {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 350px);
      min-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .timeline-era-cards::-webkit-scrollbar {
      width: 4px;
    }

    .timeline-era-cards::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-pill);
    }

    .timeline-era-cards .lecture-card {
      background: #1f1f23;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .timeline-era-cards .lecture-card:hover {
      background: #2a2a2f;
    }

    /* Пустое состояние эпохи */
    .era-empty-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 14px;
      color: var(--text-muted);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      margin: 8px 0;
    }

    .era-empty-box p {
      font-size: 0.82rem;
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    .btn-era-add {
      background: rgba(var(--accent-rgb), 0.12);
      border: 1px solid rgba(var(--accent-rgb), 0.25);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-era-add:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* 4. Компактные карточки лекций в стиле Apple */
    .lecture-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lecture-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      transition: background-color 0.15s ease, box-shadow 0.2s ease, opacity 0.25s ease, transform 0.15s ease;
      position: relative;
    }

    .lecture-card:hover {
      background: var(--bg-card-hover);
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-1px);
    }

    .lecture-card.completed {
      opacity: 0.42;
    }

    .lecture-card.completed .lecture-title {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    /* Круглый чекбокс */
    .checkbox-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .checkbox-container input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkmark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.8px solid #52525b;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .checkbox-container:hover .checkmark {
      border-color: #a1a1aa;
      transform: scale(1.06);
    }

    .checkbox-container input:checked ~ .checkmark {
      background-color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.4);
    }

    .checkmark svg {
      display: none;
      width: 11px;
      height: 11px;
      stroke: #ffffff;
      stroke-width: 2.6;
      fill: none;
    }

    .checkbox-container input:checked ~ .checkmark svg {
      display: block;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .lecture-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      word-break: break-word;
      letter-spacing: -0.01em;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .meta-lecturer {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .meta-separator {
      opacity: 0.35;
      font-size: 0.7rem;
    }

    .meta-format {
      color: var(--text-muted);
    }

    .meta-era {
      color: var(--accent);
      opacity: 0.92;
      font-weight: 500;
    }

    /* Таймкод остановки */
    .timecode-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-pill);
      padding: 1px 7px;
      transition: all 0.2s ease;
    }

    .timecode-pill.has-value {
      background: rgba(var(--accent-rgb), 0.15);
      color: var(--accent);
    }

    .timecode-input {
      width: 40px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-family: inherit;
      font-feature-settings: "tnum";
      padding: 0;
      text-align: center;
      line-height: 1.2;
    }

    .timecode-pill.has-value .timecode-input {
      color: var(--accent);
      font-weight: 600;
    }

    .timecode-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Кнопки действий (hover-reveal) */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .lecture-card:hover .card-actions,
    .lecture-card:focus-within .card-actions {
      opacity: 1;
      transform: translateX(0);
    }

    @media (hover: none) {
      .card-actions {
        opacity: 1;
        transform: none;
      }
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
      text-decoration: none;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .btn-icon.active {
      background: rgba(var(--accent-rgb), 0.15);
      color: var(--accent);
    }

    .btn-icon.has-note {
      color: var(--text-primary);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.14);
      color: var(--danger);
    }

    .note-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      position: absolute;
      top: 6px;
      right: 6px;
    }

    /* Разворачивающийся блок заметок */
    .lecture-note-drawer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, margin-top 0.2s ease;
      margin-top: 0;
    }

    .lecture-note-drawer.open {
      max-height: 220px;
      opacity: 1;
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
    }

    .note-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
      padding: 8px 10px;
      resize: vertical;
      min-height: 56px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .note-textarea:focus {
      border-color: rgba(var(--accent-rgb), 0.4);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.12);
    }

    .note-textarea::placeholder {
      color: var(--text-muted);
    }

    /* 5. Плавающая кнопка добавления (FAB) */
    .fab-add {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px -2px rgba(var(--accent-rgb), 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s ease, box-shadow 0.2s ease;
      z-index: 90;
    }

    .fab-add:hover {
      transform: scale(1.08) translateY(-2px);
      background: var(--accent-hover);
      box-shadow: 0 12px 28px rgba(var(--accent-rgb), 0.6);
    }

    .fab-add:active {
      transform: scale(0.94);
    }

    /* 6. Модальные окна с Apple-blur */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-modal);
      transform: scale(0.96);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 1.18rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .modal-close:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group-full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="url"], select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus {
      border-color: rgba(var(--accent-rgb), 0.5);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
    }

    select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .modal-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .btn-primary {
      background: var(--accent);
      border: none;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* 7. Режим «Кинотеатр» (Встроенный просмотр видео) */
    .cinema-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 12, 15, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      display: flex;
      flex-direction: column;
      z-index: 1500;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
      padding: 16px 20px 20px;
    }

    .cinema-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .cinema-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      flex-shrink: 0;
    }

    .cinema-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .cinema-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .cinema-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .cinema-badge {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .cinema-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-cinema-ext {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-cinema-ext:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
    }

    .cinema-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.15s ease;
    }

    .cinema-close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: scale(1.05);
    }

    .cinema-workspace {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      width: 100%;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      flex: 1;
      min-height: 0;
    }

    .cinema-player-box {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cinema-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .cinema-notes-panel {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-card);
      min-height: 0;
    }

    .cinema-notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cinema-notes-title {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cinema-notes-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .cinema-notes-textarea {
      width: 100%;
      flex: 1;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 12px;
      resize: none;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .cinema-notes-textarea:focus {
      border-color: rgba(var(--accent-rgb), 0.5);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
    }

    .cinema-notes-textarea::placeholder {
      color: var(--text-muted);
    }

    /* Пустые состояния */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      margin-bottom: 14px;
      opacity: 0.45;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .empty-state p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .btn-reset-filters {
      background: rgba(var(--accent-rgb), 0.15);
      color: var(--accent);
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 10px;
    }

    .btn-reset-filters:hover {
      background: var(--accent);
      color: #ffffff;
    }

    /* 8. Подвал */
    .app-footer {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-link-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s ease;
      padding: 4px;
      user-select: none;
      font-family: inherit;
    }

    .footer-link-btn:hover {
      color: var(--text-secondary);
    }

    .footer-dot {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.7rem;
    }

    .footer-note {
      font-size: 0.74rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    @media (max-width: 900px) {
      .cinema-backdrop {
        padding: 12px;
        overflow-y: auto;
      }
      .cinema-workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto 240px;
        flex: none;
      }
      .cinema-player-box {
        aspect-ratio: 16 / 9;
        height: auto;
      }
    }

    @media (max-width: 768px) {
      .container.view-timeline {
        max-width: 720px;
      }

      .timeline-track {
        display: flex;
        flex-direction: column;
        gap: 36px;
        overflow-x: visible;
        padding: 8px 0 20px;
      }

      .timeline-era-section {
        min-width: 100% !important;
        max-width: 100% !important;
        background: transparent;
        border: none;
        box-shadow: none;
        overflow: visible;
        position: relative;
        padding-left: 28px;
      }

      /* Вертикальная направляющая линия степпера */
      .timeline-era-section::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 36px;
        bottom: -36px;
        width: 2px;
        background: rgba(255, 255, 255, 0.1);
      }

      .timeline-era-section:last-child::before {
        display: none;
      }

      /* Узел эпохи на линии */
      .timeline-era-section::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 18px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.6);
        z-index: 5;
      }

      /* Липкий заголовок эпохи на мобильном */
      .timeline-era-sticky-header {
        position: sticky;
        top: 12px;
        z-index: 20;
        background: rgba(24, 24, 27, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        margin-bottom: 12px;
        padding: 12px 14px;
      }

      .timeline-era-cards {
        padding: 0;
        max-height: none !important;
        overflow-y: visible !important;
      }

      .timeline-era-cards .lecture-card {
        background: var(--bg-card);
        border: none;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 40px 14px 90px;
      }
      .header-title {
        font-size: 1.7rem;
      }
      .fab-add {
        bottom: 24px;
        right: 24px;
        width: 52px;
        height: 52px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .heatmap-card {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Общий список автодополнения для лекторов и эпох -->
  <datalist id="lecturersList"></datalist>
  <datalist id="erasList"></datalist>

  <!-- Всплывающий тултип для ячеек активности -->
  <div id="heatmapTooltip" class="heatmap-tooltip"></div>

  <div class="container">
    <!-- 1. Минималистичная шапка "Мой прогресс" -->
    <header class="app-header">
      <div class="header-top">
        <h1 class="header-title">Мой прогресс</h1>
        <div class="header-subtitle">
          <span id="completedCount">0</span> из <span id="totalCount">0</span> лекций • <span id="progressPercent">0%</span>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <span id="totalLecturesBadge" style="display: none;">0 лекций</span>
    </header>

    <!-- 2. Визуализация активности (Heatmap) в стиле GitHub -->
    <section class="heatmap-card">
      <div class="heatmap-header">
        <span class="heatmap-title">Активность занятий</span>
        <div class="heatmap-stats">
          <span id="heatmapTotalYear">0</span> действий за год
        </div>
      </div>

      <div class="heatmap-scroll" id="heatmapScroll">
        <div class="heatmap-grid-inner" id="heatmapGrid">
          <!-- Сетка активности сгенерируется через JS -->
        </div>
      </div>

      <div class="heatmap-footer">
        <span>Меньше</span>
        <div class="heatmap-legend">
          <span class="heatmap-cell level-0"></span>
          <span class="heatmap-cell level-1"></span>
          <span class="heatmap-cell level-2"></span>
          <span class="heatmap-cell level-3"></span>
        </div>
        <span>Больше</span>
      </div>
    </section>

    <!-- 3. Поиск и горизонтальные теги (Pills) -->
    <div class="search-container">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или конспекту...">
      <button type="button" id="clearSearchBtn" class="search-clear-btn" title="Очистить поиск" aria-label="Очистить поиск">✕</button>
    </div>

    <div class="filter-wrapper">
      <!-- Динамический горизонтальный трек лекторов -->
      <div class="filter-track" id="lecturerFilters">
        <!-- Генерируется через JS на основе лекций -->
      </div>

      <!-- Формат и статус в скроллируемой строке -->
      <div class="filter-track">
        <div id="formatFilters" style="display: flex; gap: 6px;">
          <button type="button" class="chip-btn active" data-filter="format" data-value="all">Все форматы</button>
          <button type="button" class="chip-btn" data-filter="format" data-value="ЕГЭ">ЕГЭ</button>
          <button type="button" class="chip-btn" data-filter="format" data-value="Олимпиады">Олимпиады</button>
        </div>

        <span class="filter-divider">|</span>

        <div id="statusFilters" style="display: flex; gap: 6px;">
          <button type="button" class="chip-btn active" data-filter="status" data-value="all">Все</button>
          <button type="button" class="chip-btn" data-filter="status" data-value="uncompleted">Не просмотрено</button>
          <button type="button" class="chip-btn" data-filter="status" data-value="completed">Просмотрено</button>
        </div>

        <button type="button" class="reset-filter-link" id="resetHeaderBtn">Сбросить</button>
      </div>
    </div>

    <!-- Панель переключения режима: Список / Таймлайн -->
    <div class="view-header-bar">
      <div class="matching-status" id="matchingCountText"></div>
      <div class="view-toggle" role="tablist" aria-label="Режим отображения">
        <button type="button" class="view-toggle-btn active" id="btnViewList" data-view="list" title="Вид списком">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>

    // Вспомогательная функция получения даты в формате YYYY-MM-DD
    function getLocalDateString(d = new Date()) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // --- Распознавание ссылок на видео (YouTube / VK / RuTube) ---
    function parseTimecodeToSeconds(tc) {
      if (!tc || typeof tc !== "string") return 0;
      const parts = tc.trim().split(":").map(p => parseInt(p, 10));
      if (parts.some(isNaN)) return 0;
      if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      } else if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      } else if (parts.length === 1) {
        return parts[0];
      }
      return 0;
    }

    function getVideoEmbedData(url, timecodeStr) {
      if (!url || typeof url !== "string") return null;

      // 1. YouTube
      const ytRegex = /(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|live|shorts)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i;
      const ytMatch = url.match(ytRegex);
      if (ytMatch && ytMatch[1]) {
        const videoId = ytMatch[1];
        let embed = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
        const startSec = parseTimecodeToSeconds(timecodeStr);
        if (startSec > 0) {
          embed += `&start=${startSec}`;
        }
        return { type: "youtube", embedUrl: embed };
      }

      // 2. VK Видео
      if (url.includes("vk.com/video_ext.php")) {
        const hasQuery = url.includes("?");
        return { type: "vk", embedUrl: url + (hasQuery ? "&autoplay=1" : "?autoplay=1") };
      }
      const vkMatch = url.match(/video(-?\d+)_(\d+)/i);
      if (vkMatch) {
        const oid = vkMatch[1];
        const id = vkMatch[2];
        const hashMatch = url.match(/[?&]hash=([a-zA-Z0-9]+)/i);
        const hashParam = hashMatch ? `&hash=${hashMatch[1]}` : "";
        return {
          type: "vk",
          embedUrl: `https://vk.com/video_ext.php?oid=${oid}&id=${id}${hashParam}&autoplay=1`
        };
      }

      // 3. RuTube
      const rutubeMatch = url.match(/rutube\.ru\/video\/([a-zA-Z0-9]+)/i);
      if (rutubeMatch) {
        return {
          type: "rutube",
          embedUrl: `https://rutube.ru/play/embed/${rutubeMatch[1]}/?autoplay=1`
        };
      }

      return null;
    }

    // --- Логика учета активности (Activity Log) ---
    function loadActivityLog() {
      try {
        const stored = localStorage.getItem(STORAGE_ACTIVITY_KEY) || localStorage.getItem("activityLog");
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && typeof parsed === "object") return parsed;
        }
      } catch (e) {
        console.error("Ошибка при чтении activityLog", e);
      }

      const seed = {};
      const now = new Date();
      const sampleDays = [
        { offset: 0, count: 3 },
        { offset: 1, count: 2 },
        { offset: 3, count: 5 },
        { offset: 5, count: 1 },
        { offset: 8, count: 4 },
        { offset: 11, count: 2 },
        { offset: 16, count: 3 }
      ];
      sampleDays.forEach(({ offset, count }) => {
        const d = new Date(now);
        d.setDate(now.getDate() - offset);
        seed[getLocalDateString(d)] = count;
      });
      saveActivityLog(seed);
      return seed;
    }

    function saveActivityLog(log = activityLog) {
      try {
        const str = JSON.stringify(log);
        localStorage.setItem(STORAGE_ACTIVITY_KEY, str);
        localStorage.setItem("activityLog", str);
      } catch (e) {
        console.error("Ошибка при записи activityLog", e);
      }
    }

    let activityLog = loadActivityLog();

    function logActivity(amount = 1) {
      const today = getLocalDateString();
      activityLog[today] = (activityLog[today] || 0) + amount;
      saveActivityLog(activityLog);

              return sanitizeLecture(item, idx);

            if (migrationNeeded) {

            }
            return result;
