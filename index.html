          .map(name => `<option value="${escapeHtml(name)}">`)
          .join("");
      }

      if (filterState.lecturer !== "all" && !uniqueLecturers.includes(filterState.lecturer)) {
        filterState.lecturer = "all";
      }

      if (lecturerFiltersEl) {
        const isAllActive = filterState.lecturer === "all";
        let html = `<button type="button" class="chip-btn ${isAllActive ? 'active' : ''}" data-filter="lecturer" data-value="all">Все лекторы</button>`;

        uniqueLecturers.forEach(name => {
          const isActive = filterState.lecturer === name;
          html += `<button type="button" class="chip-btn ${isActive ? 'active' : ''}" data-filter="lecturer" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>`;
        });

        lecturerFiltersEl.innerHTML = html;
      }
    }

    // Получение списка эпох (8 стандартных + любые пользовательские)
    function getAvailableEras() {
      const set = new Set(STANDARD_ERAS);
      lectures.forEach(l => {
        if (l.era && typeof l.era === "string") {
          const name = l.era.trim();
          if (name && name !== "Без эпохи") set.add(name);
        }
      });
      const custom = Array.from(set).filter(e => !STANDARD_ERAS.includes(e)).sort((a, b) => a.localeCompare(b, "ru"));
      return [...STANDARD_ERAS, ...custom];
    }

    function updateErasUI() {
      if (erasListDatalistEl) {
        erasListDatalistEl.innerHTML = getAvailableEras()
          .map(era => `<option value="${escapeHtml(era)}">`)
          .join("");
      }
    }

    function updateOverallProgress() {
      const total = lectures.length;
      const completed = lectures.filter(item => item.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      completedCountEl.textContent = completed;
      totalCountEl.textContent = total;
      progressPercentEl.textContent = `${percent}%`;
      progressBarEl.style.width = `${percent}%`;

      if (totalLecturesBadgeEl) {
        totalLecturesBadgeEl.textContent = `${total} лекций`;
      }
    }

    const MONTH_NAMES = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];

    function formatTooltipDate(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" });
    }

    function formatActionsCount(count) {
      if (count === 0) return "нет активности";
      const mod10 = count % 10;
      const mod100 = count % 100;
      let word = "действий";
      if (mod10 === 1 && mod100 !== 11) {
        word = "действие";
      } else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) {
        word = "действия";
      }
      return `${count} ${word}`;
    }

    function renderHeatmap() {
      if (!heatmapGridEl) return;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayDayOfWeek = (today.getDay() + 6) % 7;

      const currentWeekEnd = new Date(today);
      currentWeekEnd.setDate(today.getDate() + (6 - todayDayOfWeek));

      const startDate = new Date(currentWeekEnd);
      startDate.setDate(currentWeekEnd.getDate() - (52 * 7 - 1));

      let totalYearActions = 0;
      const monthPositions = [];
      let lastMonth = -1;

      let columnsHtml = "";

      for (let w = 0; w < 52; w++) {
        let weekHtml = `<div class="heatmap-week-col">`;

        const weekFirstDay = new Date(startDate);
        weekFirstDay.setDate(startDate.getDate() + w * 7);
        const m = weekFirstDay.getMonth();
        if (m !== lastMonth && weekFirstDay.getDate() <= 14) {
          monthPositions.push({ weekIndex: w, name: MONTH_NAMES[m] });
          lastMonth = m;
        }

        for (let d = 0; d < 7; d++) {
          const cellDate = new Date(startDate);
          cellDate.setDate(startDate.getDate() + (w * 7 + d));

          const isFuture = cellDate > today;
          const dateStr = getLocalDateString(cellDate);
          const count = isFuture ? 0 : (activityLog[dateStr] || 0);

          if (!isFuture) {
            totalYearActions += count;
          }

          let levelClass = "level-0";
          if (count >= 4) {
            levelClass = "level-3";
          } else if (count >= 2) {
            levelClass = "level-2";
          } else if (count >= 1) {
            levelClass = "level-1";
          }

          if (isFuture) {
            weekHtml += `<span class="heatmap-cell future"></span>`;
          } else {
            weekHtml += `<span class="heatmap-cell ${levelClass}" data-date="${dateStr}" data-count="${count}"></span>`;
          }
        }

        weekHtml += `</div>`;
        columnsHtml += weekHtml;
      }

      let monthsRowHtml = `<div class="heatmap-months-row">`;
      monthPositions.forEach(item => {
        const leftPx = item.weekIndex * 13;
        monthsRowHtml += `<span class="heatmap-month-label" style="left: ${leftPx}px">${item.name}</span>`;
      });
      monthsRowHtml += `</div>`;

      heatmapGridEl.innerHTML = `
        ${monthsRowHtml}
        <div class="heatmap-body">
          <div class="heatmap-days-col">
            <span>Пн</span>
            <span></span>
            <span>Ср</span>
            <span></span>
            <span>Пт</span>
            <span></span>
            <span></span>
          </div>
          <div class="heatmap-columns">
            ${columnsHtml}
          </div>
        </div>
      `;

      if (heatmapTotalYearEl) {
        heatmapTotalYearEl.textContent = totalYearActions;
      }

      if (heatmapScrollEl) {
        requestAnimationFrame(() => {
          heatmapScrollEl.scrollLeft = heatmapScrollEl.scrollWidth;
        });
      }
    }

    if (heatmapGridEl && heatmapTooltipEl) {
      heatmapGridEl.addEventListener("mouseover", (e) => {
        const cell = e.target.closest(".heatmap-cell[data-date]");
        if (!cell) return;

        const dateStr = cell.getAttribute("data-date");
        const count = parseInt(cell.getAttribute("data-count") || "0", 10);
        const formattedDate = formatTooltipDate(dateStr);
        const formattedCount = formatActionsCount(count);

        heatmapTooltipEl.textContent = `${formattedDate}: ${formattedCount}`;
        heatmapTooltipEl.classList.add("visible");

        const rect = cell.getBoundingClientRect();
        heatmapTooltipEl.style.left = `${rect.left + rect.width / 2}px`;
        heatmapTooltipEl.style.top = `${rect.top}px`;
      });

      heatmapGridEl.addEventListener("mouseout", (e) => {
        const cell = e.target.closest(".heatmap-cell");
        if (cell) {
          heatmapTooltipEl.classList.remove("visible");
        }
      });
    }

    // --- Функции режима «Кинотеатр» ---
    function openCinemaModal(item, embedUrl) {
      activeCinemaLectureId = item.id;
      cinemaTitleEl.textContent = item.title;
      cinemaLecturerEl.textContent = item.lecturer;
      cinemaFormatEl.textContent = item.format;
      if (cinemaEraEl) {
        if (item.era && item.era !== "Без эпохи") {
          cinemaEraEl.textContent = item.era;
          cinemaEraEl.style.display = "inline-block";
        } else {
          cinemaEraEl.style.display = "none";
        }
      }
      cinemaExternalLinkEl.href = item.url;
      cinemaNotesTextareaEl.value = item.note || "";
      cinemaIframeEl.src = embedUrl;

      cinemaBackdropEl.classList.add("active");
      cinemaBackdropEl.setAttribute("aria-hidden", "false");
    }

    function closeCinemaModal() {
      cinemaBackdropEl.classList.remove("active");
      cinemaBackdropEl.setAttribute("aria-hidden", "true");
      cinemaIframeEl.src = ""; // Очищаем src, чтобы остановить воспроизведение видео и звука!
      activeCinemaLectureId = null;
    }

    cinemaCloseBtnEl.addEventListener("click", closeCinemaModal);

    cinemaBackdropEl.addEventListener("click", (e) => {
      if (e.target === cinemaBackdropEl) {
        closeCinemaModal();
      }
    });

    // Синхронизация заметок из плеера в базу и карточки
    cinemaNotesTextareaEl.addEventListener("input", (e) => {
      if (!activeCinemaLectureId) return;
      const item = lectures.find(l => l.id === activeCinemaLectureId);
      if (item) {
        item.note = e.target.value;
        saveLectures(lectures);

        const card = document.querySelector(`.lecture-card[data-id="${activeCinemaLectureId}"]`);
        if (card) {
          const cardTextarea = card.querySelector(".note-textarea");
          if (cardTextarea) cardTextarea.value = item.note;

          const noteBtn = card.querySelector(".btn-note");
          if (noteBtn) {
            const hasNote = Boolean(item.note && item.note.trim());
            noteBtn.classList.toggle("has-note", hasNote);
            let dot = noteBtn.querySelector(".note-dot");
            if (hasNote && !dot) {
              const newDot = document.createElement("span");
              newDot.className = "note-dot";
              noteBtn.appendChild(newDot);
            } else if (!hasNote && dot) {
              dot.remove();
            }
          }
        }
        logTypingActivity();
      }
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getFilteredLectures() {
      const query = filterState.search.trim().toLowerCase();

      return lectures.filter(item => {
        if (query) {
          const titleMatch = (item.title || "").toLowerCase().includes(query);
          const noteMatch = (item.note || "").toLowerCase().includes(query);
          if (!titleMatch && !noteMatch) return false;
        }

        if (filterState.lecturer !== "all" && item.lecturer !== filterState.lecturer) {
          return false;
        }

        if (filterState.format !== "all" && item.format !== filterState.format) {
          return false;
        }

        if (filterState.status === "completed" && !item.completed) {
          return false;
        }
        if (filterState.status === "uncompleted" && item.completed) {
          return false;
        }

        return true;
      });
    }

    function isFilterActive() {
      return (
        filterState.search.trim() !== "" ||
        filterState.lecturer !== "all" ||
        filterState.format !== "all" ||
        filterState.status !== "all"
      );
    }

    function resetAllFilters() {
      filterState.search = "";
      filterState.lecturer = "all";
      filterState.format = "all";
      filterState.status = "all";

      searchInputEl.value = "";
      clearSearchBtnEl.style.display = "none";

      document.querySelectorAll(".chip-btn").forEach(btn => {
        const isAll = btn.getAttribute("data-value") === "all";
        btn.classList.toggle("active", isAll);
      });

      render();
    }

    // Генерация HTML карточки лекции (общая для обычного списка и таймлайна)
    function renderCardHtml(item) {
      const isCompleted = Boolean(item.completed);
      const timecodeValue = (item.timecode || "").trim();
      const hasTimecode = timecodeValue.length > 0;
      const noteValue = item.note || "";
      const hasNote = noteValue.trim().length > 0;
      const isNoteOpen = openNoteIds.has(item.id);
      const hasEra = item.era && item.era !== "Без эпохи";

      return `
        <article class="lecture-card ${isCompleted ? 'completed' : ''}" data-id="${item.id}">
          <div class="card-main">
            <div class="card-left">
              <!-- Круглый чекбокс -->
              <label class="checkbox-container" title="${isCompleted ? 'Отметить как непросмотренное' : 'Отметить как просмотренное'}">
                <input type="checkbox" class="toggle-checkbox" ${isCompleted ? 'checked' : ''}>
                <span class="checkmark">
                  <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
              </label>

              <!-- Контент: Название и мета снизу -->
              <div class="card-content">
                <h4 class="lecture-title">${escapeHtml(item.title)}</h4>
                <div class="meta-row">
                  <span class="meta-lecturer">${escapeHtml(item.lecturer)}</span>
                  <span class="meta-separator">•</span>
                  <span class="meta-format">${escapeHtml(item.format)}</span>
                  ${hasEra ? `
                    <span class="meta-separator">•</span>
                    <span class="meta-era">${escapeHtml(item.era)}</span>
                  ` : ''}

                  <!-- Компактный таймкод -->
                  <div class="timecode-pill ${hasTimecode ? 'has-value' : ''}" title="Таймкод остановки">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"></circle>
                      <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <input type="text" class="timecode-input" placeholder="00:00" value="${escapeHtml(timecodeValue)}" maxlength="10">
                  </div>
                </div>
              </div>
            </div>

            <!-- Кнопки действий (видны при hover) -->
            <div class="card-actions">
              <!-- Конспект -->
              <button type="button" class="btn-icon btn-note ${hasNote ? 'has-note' : ''} ${isNoteOpen ? 'active' : ''}" title="${hasNote ? 'Есть конспект (нажмите, чтобы открыть)' : 'Открыть заметку'}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                ${hasNote ? '<span class="note-dot"></span>' : ''}
              </button>

              <!-- Смотреть (Кинотеатр) -->
              <button type="button" class="btn-icon btn-watch" title="Смотреть видео (Режим кинотеатра)" aria-label="Смотреть видео">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </button>

              <!-- Редактировать -->
              <button type="button" class="btn-icon btn-edit" title="Редактировать лекцию" aria-label="Редактировать">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                </svg>
              </button>

              <!-- Удалить -->
              <button type="button" class="btn-icon btn-delete" title="Удалить лекцию" aria-label="Удалить">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Разворачивающийся блок заметок -->
          <div class="lecture-note-drawer ${isNoteOpen ? 'open' : ''}">
            <textarea class="note-textarea" placeholder="Конспект, важные даты и мысли по лекции...">${escapeHtml(noteValue)}</textarea>
          </div>
        </article>
      `;
    }

    const ROMAN_NUMERALS = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];

    // Рендер режима «Таймлайн по эпохам»
    function renderTimeline(filtered) {
      if (!timelineTrackEl || !timelineNavTrackEl) return;

      const eraMap = new Map();

      // Если фильтры не активны — показываем все 8 стандартных эпох
      if (!isFilterActive()) {
        STANDARD_ERAS.forEach(era => eraMap.set(era, []));
      }

      // Группируем отфильтрованные лекции по эпохам
      filtered.forEach(item => {
        const era = item.era || "Без эпохи";
        if (!eraMap.has(era)) {
          eraMap.set(era, []);
        }
        eraMap.get(era).push(item);
      });

      // Также учитываем кастомные эпохи из общей базы, если фильтр выключен
      if (!isFilterActive()) {
        lectures.forEach(item => {
          const era = item.era || "Без эпохи";
          if (!eraMap.has(era)) {
            eraMap.set(era, []);
          }
        });
      }

      // Сортировка эпох: сначала стандартные эпохи хронологически, затем кастомные по алфавиту, «Без эпохи» в конце
      const sortedEras = Array.from(eraMap.keys()).sort((a, b) => {
        const idxA = STANDARD_ERAS.indexOf(a);
        const idxB = STANDARD_ERAS.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        if (a === "Без эпохи") return 1;
        if (b === "Без эпохи") return -1;
        return a.localeCompare(b, "ru");
      });

      // При активном поиске/фильтрах скрываем эпохи, в которых 0 совпадений
      const displayEras = isFilterActive()
        ? sortedEras.filter(era => (eraMap.get(era) || []).length > 0)
        : sortedEras;

      if (displayEras.length === 0) {
        timelineNavTrackEl.innerHTML = "";
        timelineTrackEl.innerHTML = `
          <div class="empty-state" style="width: 100%;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <p>В таймлайне по выбранным фильтрам ничего не найдено</p>
            <button type="button" class="btn-reset-filters" id="emptyResetBtn">Сбросить фильтры</button>
          </div>
        `;
        return;
      }

      // 1. Быстрая навигация по эпохам (pills)
      timelineNavTrackEl.innerHTML = displayEras.map((era) => {
        const items = eraMap.get(era) || [];
        const completed = items.filter(l => l.completed).length;
        const total = items.length;
        const isComplete = total > 0 && completed === total;
        const shortName = era.replace(/\s*\([^)]*\)/, "").trim();

        return `
          <button type="button" class="timeline-nav-pill ${isComplete ? 'completed-all' : ''}" data-era-target="${escapeHtml(era)}" title="Перейти к эпохе: ${escapeHtml(era)}">
            <span class="nav-pill-dot"></span>
            <span class="nav-pill-title">${escapeHtml(shortName)}</span>
            <span class="nav-pill-badge">${completed}/${total}</span>
          </button>
        `;
      }).join("");

      // 2. Основная дорожка таймлайна с крупными sticky шапками
      timelineTrackEl.innerHTML = displayEras.map((era) => {
        const items = eraMap.get(era) || [];
        const total = items.length;
        const completed = items.filter(l => l.completed).length;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        const standardIdx = STANDARD_ERAS.indexOf(era);
        const indexLabel = standardIdx !== -1 ? `Эпоха ${ROMAN_NUMERALS[standardIdx] || standardIdx + 1}` : "Период";

        let cardsHtml = "";
        if (total === 0) {
          cardsHtml = `
            <div class="era-empty-box">
              <p>В этой эпохе пока нет лекций</p>
              <button type="button" class="btn-era-add" onclick="openAddModalWithEra('${escapeHtml(era)}')">+ Добавить лекцию</button>
            </div>
          `;
        } else {
          cardsHtml = items.map(item => renderCardHtml(item)).join("");
        }

        return `
          <section class="timeline-era-section" data-era="${escapeHtml(era)}">
            <div class="timeline-era-sticky-header">
              <div class="era-header-top">
                <div class="era-badge-row">
                  <span class="era-milestone-dot"></span>
                  <span class="era-index-label">${indexLabel}</span>
                </div>
                <span class="era-counter-pill">${completed} из ${total} просмотрено</span>
              </div>
              <h3 class="era-title">${escapeHtml(era)}</h3>
              <div class="era-progress-bar">
                <div class="era-progress-fill" style="width: ${percent}%;"></div>
              </div>
            </div>

            <div class="timeline-era-cards">
              ${cardsHtml}
            </div>
          </section>
        `;
      }).join("");
    }

    function render() {
      updateLecturersUI();
      updateErasUI();
      updateOverallProgress();
      renderHeatmap();

      const containerEl = document.querySelector(".container");

      // Применение текущего режима отображения (список / таймлайн)
      if (currentViewMode === "timeline") {
        listElement.style.display = "none";
        timelineContainerEl.style.display = "block";
        containerEl.classList.add("view-timeline");
        btnViewList.classList.remove("active");
        btnViewTimeline.classList.add("active");
      } else {
        listElement.style.display = "flex";
        timelineContainerEl.style.display = "none";
        containerEl.classList.remove("view-timeline");
        btnViewList.classList.add("active");
        btnViewTimeline.classList.remove("active");
      }

      if (lectures.length === 0) {
        matchingCountTextEl.textContent = "";
        listElement.innerHTML = `
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            <p>Список пуст</p>
            <button type="button" class="btn-reset-filters" onclick="openAddModal()">Добавить первую лекцию</button>
          </div>
        `;
        if (timelineTrackEl) timelineTrackEl.innerHTML = "";
        if (timelineNavTrackEl) timelineNavTrackEl.innerHTML = "";
        return;
      }

      const filtered = getFilteredLectures();

      if (isFilterActive()) {
        matchingCountTextEl.textContent = `Найдено: ${filtered.length} из ${lectures.length}`;
      } else {
        matchingCountTextEl.textContent = "";
      }

      if (filtered.length === 0) {
        listElement.innerHTML = `
          <div class="empty-state">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <p>По выбранным фильтрам ничего не найдено</p>
            <button type="button" class="btn-reset-filters" id="emptyResetBtn">Сбросить фильтры</button>
          </div>
        `;
      } else {
        listElement.innerHTML = filtered.map(item => renderCardHtml(item)).join("");
      }

      // Обновляем таймлайн
      renderTimeline(filtered);
    }

    // --- Обработчики поиска и фильтров ---
    searchInputEl.addEventListener("input", (e) => {
      filterState.search = e.target.value;
      clearSearchBtnEl.style.display = filterState.search ? "flex" : "none";
      render();
    });

    clearSearchBtnEl.addEventListener("click", () => {
      filterState.search = "";
      searchInputEl.value = "";
      clearSearchBtnEl.style.display = "none";
      searchInputEl.focus();
      render();
    });

    document.querySelector(".filter-wrapper").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip-btn");
      if (!chip) return;

      const groupType = chip.getAttribute("data-filter");
      const value = chip.getAttribute("data-value");

      if (groupType && filterState.hasOwnProperty(groupType)) {
        filterState[groupType] = value;

        if (groupType === "lecturer") {
          render();
        } else {
          chip.parentElement.querySelectorAll(".chip-btn").forEach(btn => {
            btn.classList.toggle("active", btn === chip);
          });
          render();
        }
      }
    });

    resetHeaderBtnEl.addEventListener("click", resetAllFilters);

    // --- Переключение режимов отображения (Список / Таймлайн) ---
    btnViewList.addEventListener("click", () => {
      currentViewMode = "list";
      localStorage.setItem("history_view_mode_v1", "list");
      render();
    });

    btnViewTimeline.addEventListener("click", () => {
      currentViewMode = "timeline";
      localStorage.setItem("history_view_mode_v1", "timeline");
      render();
    });

    // Быстрый скролл к эпохе при клике по pill-табу
    if (timelineNavTrackEl) {
      timelineNavTrackEl.addEventListener("click", (e) => {
        const pill = e.target.closest(".timeline-nav-pill");
        if (!pill) return;
        const targetEra = pill.getAttribute("data-era-target");
        if (!targetEra) return;

        const targetSection = timelineTrackEl.querySelector(`.timeline-era-section[data-era="${CSS.escape(targetEra)}"]`);
        if (targetSection) {
          targetSection.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
        }

        timelineNavTrackEl.querySelectorAll(".timeline-nav-pill").forEach(p => p.classList.toggle("active", p === pill));
      });
    }

    // Горизонтальный скролл колесиком мыши для ленты таймлайна на десктопе
    if (timelineTrackEl) {
      timelineTrackEl.addEventListener("wheel", (e) => {
        if (window.innerWidth > 768 && Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) {
          const scrollableCards = e.target.closest(".timeline-era-cards");
          if (scrollableCards && scrollableCards.scrollHeight > scrollableCards.clientHeight) {
            const atTop = scrollableCards.scrollTop === 0 && e.deltaY < 0;
            const atBottom = scrollableCards.scrollTop + scrollableCards.clientHeight >= scrollableCards.scrollHeight && e.deltaY > 0;
            if (!atTop && !atBottom) return;
          }
          e.preventDefault();
          timelineTrackEl.scrollLeft += e.deltaY * 1.2;
        }
      }, { passive: false });
    }

    // --- Интерактивные действия с карточками (делегирование на mainContainerEl) ---
    mainContainerEl.addEventListener("click", (e) => {
      if (e.target.closest("#emptyResetBtn")) {
        resetAllFilters();
      }
    });

    // Автосохранение таймкода и заметок
    mainContainerEl.addEventListener("input", (e) => {
      if (e.target.classList.contains("timecode-input")) {
        const card = e.target.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const item = lectures.find(l => l.id === lectureId);
        if (item) {
          item.timecode = e.target.value.trim();
          saveLectures(lectures);
          const container = e.target.closest(".timecode-pill");
          if (container) {
            container.classList.toggle("has-value", Boolean(item.timecode));
          }
          logTypingActivity();
        }
        return;
      }

      if (e.target.classList.contains("note-textarea")) {
        const card = e.target.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const item = lectures.find(l => l.id === lectureId);
        if (item) {
          item.note = e.target.value;
          saveLectures(lectures);

          const noteBtn = card.querySelector(".btn-note");
          if (noteBtn) {
            const hasNote = Boolean(item.note && item.note.trim());
            noteBtn.classList.toggle("has-note", hasNote);
            let dot = noteBtn.querySelector(".note-dot");
            if (hasNote && !dot) {
              const newDot = document.createElement("span");
              newDot.className = "note-dot";
              noteBtn.appendChild(newDot);
            } else if (!hasNote && dot) {
              dot.remove();
            }
          }
          logTypingActivity();
        }
        return;
      }
    });

    // Клики по карточке в списке или таймлайне
    mainContainerEl.addEventListener("click", (e) => {
      // 1. Клик по кнопке "Смотреть" (Режим «Кинотеатр»)
      const watchBtn = e.target.closest(".btn-watch");
      if (watchBtn) {
        e.preventDefault();
        const card = watchBtn.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const item = lectures.find(l => l.id === lectureId);
        if (!item) return;

        const embedData = getVideoEmbedData(item.url, item.timecode);
        if (embedData) {
          openCinemaModal(item, embedData.embedUrl);
        } else {
          // Если ссылку невозможно встроить — открываем в новой вкладке
          window.open(item.url, "_blank", "noopener,noreferrer");
        }
        return;
      }

      // 2. Раскрытие / сворачивание заметок
      const noteBtn = e.target.closest(".btn-note");
      if (noteBtn) {
        const card = noteBtn.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const drawer = card.querySelector(".lecture-note-drawer");
        const textarea = card.querySelector(".note-textarea");

        if (openNoteIds.has(lectureId)) {
          openNoteIds.delete(lectureId);
          drawer.classList.remove("open");
          noteBtn.classList.remove("active");
        } else {
          openNoteIds.add(lectureId);
          drawer.classList.add("open");
          noteBtn.classList.add("active");
          if (textarea) {
            setTimeout(() => textarea.focus(), 120);
          }
        }
        return;
      }

      // 3. Редактирование
      const editBtn = e.target.closest(".btn-edit");
      if (editBtn) {
        const card = editBtn.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const item = lectures.find(l => l.id === lectureId);
        if (item) {
          openEditModal(item);
        }
        return;
      }

      // 4. Удаление с подтверждением
      const deleteBtn = e.target.closest(".btn-delete");
      if (deleteBtn) {
        const card = deleteBtn.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const item = lectures.find(l => l.id === lectureId);
        const title = item ? item.title : "эту лекцию";

        if (confirm(`Удалить лекцию «${title}»?\nВсе заметки и таймкоды к ней также будут безвозвратно удалены.`)) {
          openNoteIds.delete(lectureId);
          lectures = lectures.filter(l => l.id !== lectureId);
          saveLectures(lectures);
          render();
          logActivity(1);
        }
        return;
      }
    });

    // Переключение чекбокса "Просмотрено"
    mainContainerEl.addEventListener("change", (e) => {
      if (e.target.classList.contains("toggle-checkbox")) {
        const card = e.target.closest(".lecture-card");
        if (!card) return;
        const lectureId = card.getAttribute("data-id");
        const item = lectures.find(l => l.id === lectureId);
        if (item) {
          item.completed = e.target.checked;
          saveLectures(lectures);
          render();
          logActivity(e.target.checked ? 3 : 1);
        }
      }
    });

    // --- Модальное окно добавления (FAB) ---
    function openAddModal() {
      addModalEl.classList.add("active");
      addModalEl.setAttribute("aria-hidden", "false");
      setTimeout(() => document.getElementById("lectureTitle").focus(), 100);
    }

    // Открытие модалки с предустановленной эпохой (из таймлайна)
    window.openAddModalWithEra = function(eraName) {
      openAddModal();
      if (lectureEraInputEl && eraName) {
        lectureEraInputEl.value = eraName;
      }
    };

    function closeAddModal() {
      addModalEl.classList.remove("active");
      addModalEl.setAttribute("aria-hidden", "true");
    }

    openAddModalBtnEl.addEventListener("click", () => {
      if (lectureEraInputEl) lectureEraInputEl.value = "";
      openAddModal();
    });
    addModalCloseEl.addEventListener("click", closeAddModal);
    addModalCancelEl.addEventListener("click", closeAddModal);

    addModalEl.addEventListener("click", (e) => {
      if (e.target === addModalEl) closeAddModal();
    });

    addLectureFormEl.addEventListener("submit", (e) => {
      e.preventDefault();

      const titleInput = document.getElementById("lectureTitle");
      const urlInput = document.getElementById("lectureUrl");
      const lecturerInput = document.getElementById("lectureLecturer");
      const formatInput = document.getElementById("lectureFormat");

      const title = titleInput.value.trim();
      let url = urlInput.value.trim();
      const lecturer = lecturerInput.value.trim();
      const format = formatInput.value;
      const era = (lectureEraInputEl ? lectureEraInputEl.value.trim() : "") || "Без эпохи";

      if (!title || !url || !lecturer) return;

      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      const newLecture = {
        id: "lec-" + Date.now() + "-" + Math.random().toString(36).substring(2, 7),
        title,
        url,
        lecturer,
        format,
        era,
        completed: false,
        timecode: "",
        note: ""
      };

      lectures.unshift(newLecture);
      saveLectures(lectures);
      render();

      titleInput.value = "";
      urlInput.value = "";
      lecturerInput.value = "";
      if (lectureEraInputEl) lectureEraInputEl.value = "";
      closeAddModal();

      logActivity(3);
    });

    // --- Модальное окно редактирования ---
    function openEditModal(item) {
      editLectureIdEl.value = item.id;
      editLectureTitleEl.value = item.title;
      editLectureUrlEl.value = item.url;
      editLectureLecturerEl.value = item.lecturer;
      editLectureFormatEl.value = item.format;
      if (editLectureEraEl) {
        editLectureEraEl.value = item.era && item.era !== "Без эпохи" ? item.era : "";
      }

      editModalEl.classList.add("active");
      editModalEl.setAttribute("aria-hidden", "false");
      setTimeout(() => editLectureTitleEl.focus(), 100);
    }

    function closeEditModal() {
      editModalEl.classList.remove("active");
      editModalEl.setAttribute("aria-hidden", "true");
    }

    editModalCloseEl.addEventListener("click", closeEditModal);
    editModalCancelEl.addEventListener("click", closeEditModal);

    editModalEl.addEventListener("click", (e) => {
      if (e.target === editModalEl) closeEditModal();
    });

    editLectureFormEl.addEventListener("submit", (e) => {
      e.preventDefault();

      const id = editLectureIdEl.value;
      const item = lectures.find(l => l.id === id);
      if (!item) return;

      const newTitle = editLectureTitleEl.value.trim();
      let newUrl = editLectureUrlEl.value.trim();
      const newLecturer = editLectureLecturerEl.value.trim();

      if (!newTitle || !newUrl || !newLecturer) return;

      if (!/^https?:\/\//i.test(newUrl)) {
        newUrl = "https://" + newUrl;
      }

      item.title = newTitle;
      item.url = newUrl;
      item.lecturer = newLecturer;
      item.format = editLectureFormatEl.value;
      if (editLectureEraEl) {
        item.era = editLectureEraEl.value.trim() || "Без эпохи";
      }

      saveLectures(lectures);
      render();
      closeEditModal();

      logActivity(1);
    });

    // Закрытие модалок по Escape
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (cinemaBackdropEl.classList.contains("active")) {
          closeCinemaModal();
          return;
        }
        if (editModalEl.classList.contains("active")) closeEditModal();
        if (addModalEl.classList.contains("active")) closeAddModal();
      }
    });

    // --- Бэкап и восстановление (JSON) ---
    exportBackupBtnEl.addEventListener("click", () => {
      if (lectures.length === 0) {
        alert("База лекций пуста. Нечего экспортировать.");
        return;
      }

      const dateStr = new Date().toISOString().slice(0, 10);
      const filename = `history-backup-${dateStr}.json`;
      const exportData = {
        lectures: lectures,
        activityLog: activityLog
      };
      const dataStr = JSON.stringify(exportData, null, 2);
      const blob = new Blob([dataStr], { type: "application/json;charset=utf-8" });

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    });

    importBackupInputEl.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);

          let importedLectures = null;
          let importedActivity = null;

          if (Array.isArray(parsed)) {
            importedLectures = parsed;
          } else if (parsed && typeof parsed === "object" && Array.isArray(parsed.lectures)) {
            importedLectures = parsed.lectures;
            if (parsed.activityLog && typeof parsed.activityLog === "object") {
              importedActivity = parsed.activityLog;
            }
          } else {
            throw new Error("Неверная структура файла.");
          }

          const confirmed = confirm(
            `Восстановить базу из файла «${file.name}»?\n\nВ файле найдено: ${importedLectures.length} лекций.\nВНИМАНИЕ: Текущие данные в трекере будут заменены.`
          );

          if (!confirmed) {
            importBackupInputEl.value = "";
            return;
          }

          lectures = importedLectures.map((item, idx) => sanitizeLecture(item, idx));
          if (importedActivity) {
            activityLog = importedActivity;
            saveActivityLog(activityLog);
          }
          openNoteIds.clear();
          saveLectures(lectures);
          render();

          alert(`База успешно восстановлена! Загружено ${lectures.length} лекций.`);
        } catch (err) {
          console.error("Ошибка при импорте бэкапа", err);
          alert("Не удалось загрузить файл бэкапа. Убедитесь, что это корректный .json файл трекера.");
        } finally {
          importBackupInputEl.value = "";
        }
      };

      reader.readAsText(file, "utf-8");
    });

    // Первый запуск
    render();
  </script>
</body>
</html>
